<svg width="100" height="100" viewBox="0 0 120 120" xmlns="http://w3.org">
  <defs>
    <linearGradient id="cellGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F80ED" />
      <stop offset="100%" stop-color="#43A047" />
    </linearGradient>
  </defs>
  <g transform="translate(15, 15) scale(0.75)">
    <!-- Corpo do Smartphone -->
    <rect x="22" y="10" width="56" height="84" rx="10" fill="url(#cellGradient)"/>
    <!-- Auto-falante superior -->
    <line x1="42" y1="16" x2="58" y2="16" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <!-- Botão Home minimalista -->
    <circle cx="50" cy="82" r="5" fill="#FFFFFF" opacity="0.8"/>
    <!-- Brilho da Tela Interna -->
    <rect x="28" y="24" width="44" height="48" rx="2" fill="#FFFFFF" opacity="0.2"/>
  </g>
</svg>
